<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <div class="value powerup-queue" id="powerup-queue">—</div>
          <div class="powerup-freeze hidden" id="powerup-freeze">❄️ FREEZE <span id="powerup-freeze-time"></span>s</div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>F</kbd> usar power-up</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="highscore-entry" class="highscore-entry hidden">
          <p class="highscore-entry-label">¡Nueva puntuación en el top 5!</p>
          <div class="highscore-entry-row">
            <input id="highscore-name-input" type="text" maxlength="12" placeholder="Jugador" autocomplete="off" />
            <button id="highscore-save-btn" type="button">Guardar</button>
          </div>
        </div>

        <div id="highscores-section" class="highscores-section hidden">
          <span class="label">RECORDS</span>
          <table class="highscores-table" id="highscores-table">
            <tbody id="highscores-body"></tbody>
          </table>
          <div class="highscore-stats" id="highscore-stats"></div>
          <button id="clear-highscores-btn" class="secondary-btn" type="button">Borrar records</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
