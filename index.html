<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
    <div id="skin-picker" class="skin-picker" role="group" aria-label="Seleccionar skin">
      <button type="button" class="skin-btn" data-skin="retro" aria-label="Skin Retro" title="Retro">🟦</button>
      <button type="button" class="skin-btn" data-skin="neon" aria-label="Skin Neon" title="Neon">💠</button>
      <button type="button" class="skin-btn" data-skin="pastel" aria-label="Skin Pastel" title="Pastel">🌸</button>
      <button type="button" class="skin-btn" data-skin="pixel" aria-label="Skin Pixel art" title="Pixel art">🕹️</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value combo-value" id="combo">—</span>
        </div>

        <div class="panel-section">
          <span class="label">MEJOR RACHA</span>
          <div class="best-stats">
            <span id="best-combo">Combo: 0</span>
            <span id="best-lines">Líneas: 0</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <div class="value powerup-queue" id="powerup-queue">—</div>
          <div class="powerup-freeze hidden" id="powerup-freeze">❄️ FREEZE <span id="powerup-freeze-time"></span>s</div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>F</kbd> usar power-up</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
